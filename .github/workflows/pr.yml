# No `paths-ignore` here: a required check that never starts stays pending, so docs-only PRs are skipped inside the
# workflow, where the required job `ci` still reports.
# No `push` trigger: `main` requires an up-to-date branch, so the PR run already checked what merges (RRDPLAT-114).
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  packages: read
jobs:
  ci:
    uses: buildproveship/config/.github/workflows/reusable-ci.yml@a019c09ef8464c80cd52eec331d2626cbf396d45
    with:
      check-command: "npm run build && npm run typecheck && npm run lint && npm run format:check && npm run check:guardrails && npm run test:unit"
