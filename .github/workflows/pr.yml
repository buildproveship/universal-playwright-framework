# No `paths-ignore` here: a required check that never starts stays pending, so docs-only PRs are skipped inside the
# workflow, where the required job `ci` still reports.
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  packages: read
jobs:
  ci:
    uses: releaseready/config/.github/workflows/reusable-ci.yml@cb14844935500578e1bb2d18c95d8f58c8f9fdd0
    with:
      runner: ubuntu-24.04
      check-command: "npm run build && npm run typecheck && npm run lint && npm run format:check && npm run check:guardrails && npm run test:unit"
