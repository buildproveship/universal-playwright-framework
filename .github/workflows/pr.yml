# Runs on the org's self-hosted macOS arm64 runner (rr-local); hosted minutes are not used.
# Light pull request checks. Owner decision of 18 Nov 2026 (docs/decisions.md): build, lint, typecheck and unit tests run on
# every pull request. Suites that launch a browser or a local server run on demand and nightly (nightly.yml). This replaces the
# 12 Nov 2026 manual-only Actions decision (RRDPLAT-44) for this light set only.
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  packages: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, rr-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Guardrails
        run: npm run check:guardrails
      - name: Unit tests (no browser)
        run: npm run test:unit
  security:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, rr-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, trivy, semgrep and zizmor
        uses: releaseready/config/.github/actions/security-scan@0e256fb3dff2777b7a1ca31342eae322935f06d2 # v2.2.1
