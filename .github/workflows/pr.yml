# No `paths-ignore` here: a required check that never starts stays pending, so docs-only PRs are skipped inside the
# workflow, where the required job `ci` still reports.
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  packages: read
jobs:
  ci:
    uses: buildproveship/config/.github/workflows/reusable-ci.yml@2cbada7d9a56183428c9a97ffaef5a66f61b7a16
    with:
      runner: ubuntu-24.04
      check-command: "npm run build && npm run typecheck && npm run lint && npm run format:check && npm run check:guardrails && npm run test:unit"
