# Heavy suites. Owner decision of 18 Nov 2026 (docs/decisions.md): the suites that launch a browser or a local server (npm run test:browser: Playwright, Cucumber browser profiles, browser login and isolation tests, the readiness tests) run on demand and weekly (Sunday),
# not on every pull request (the light set is in pr.yml). To keep Actions spend minimal (org budget $10/month) a scheduled
# run is skipped when main has no new commit since the last successful run.
name: Browser suites
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC, Monday 02:00 Hong Kong time
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Skip scheduled run when main is unchanged since the last success
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last="$(gh run list --workflow nightly.yml --status success --json headSha --limit 1 --jq '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::No new commit on main since the last successful run ($last); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@buildproveship"
      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.gate.outputs.skip != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies (browser cache hit)
        if: steps.gate.outputs.skip != 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # cucumber-timeouts.test.js reads reports/cucumber-results.json, which test:browser only writes after it.
      # The order is fixed here, not in package.json: package.json is part of the reviewed imported-implementation
      # revision (src/adapter/imported-v1.ts), which only an implementation review may change.
      - name: Cucumber E2E report
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:features
      - name: Browser suites
        if: steps.gate.outputs.skip != 'true'
        run: npm run test:browser
